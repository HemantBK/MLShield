[project]
name = "mlshield"
version = "0.1.0"
description = "ML-Infrastructure-Aware Anomaly Detection for Weight Exfiltration"
requires-python = ">=3.10"

dependencies = [
    # Core
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "redis>=5.0.0",

    # ML Detection (Layer 2)
    "torch>=2.1.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.1.0",

    # Kubernetes
    "kubernetes>=28.1.0",

    # Monitoring
    "prometheus-client>=0.19.0",

    # HTTP client (for LLM API calls)
    "httpx>=0.25.0",

    # Logging & Utils
    "structlog>=23.2.0",
    "rich>=13.7.0",
    "click>=8.1.0",

    # API security
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
