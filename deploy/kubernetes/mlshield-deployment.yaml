apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlshield
  namespace: mlshield
  labels:
    app.kubernetes.io/name: mlshield
    app.kubernetes.io/component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlshield
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlshield
        app.kubernetes.io/component: api-server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mlshield
      containers:
        - name: mlshield
          image: mlshield:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MLSHIELD_CONFIG
              value: /app/configs/default_specs.yaml
            - name: MLSHIELD_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: mlshield-config
                  key: redis_url
            - name: MLSHIELD_LOG_LEVEL
              value: "INFO"
            - name: MLSHIELD_K8S_AUDIT_LOG
              value: /var/log/kubernetes/audit.log
            - name: MLSHIELD_DCGM_URL
              value: http://dcgm-exporter.mlshield.svc:9400/metrics
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mlshield-secrets
                  key: anthropic-api-key
                  optional: true
          volumeMounts:
            - name: k8s-audit-logs
              mountPath: /var/log/kubernetes
              readOnly: true
            - name: config
              mountPath: /app/configs
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: k8s-audit-logs
          hostPath:
            path: /var/log/kubernetes
            type: DirectoryOrCreate
        - name: config
          configMap:
            name: mlshield-specs
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlshield
  namespace: mlshield
  labels:
    app.kubernetes.io/name: mlshield
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mlshield-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "secrets", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mlshield-reader-binding
subjects:
  - kind: ServiceAccount
    name: mlshield
    namespace: mlshield
roleRef:
  kind: ClusterRole
  name: mlshield-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlshield-config
  namespace: mlshield
data:
  redis_url: "redis://redis.mlshield.svc:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: mlshield-secrets
  namespace: mlshield
type: Opaque
data: {}
  # anthropic-api-key: <base64-encoded-key>
