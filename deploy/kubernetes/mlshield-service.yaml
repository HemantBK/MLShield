apiVersion: v1
kind: Service
metadata:
  name: mlshield
  namespace: mlshield
  labels:
    app.kubernetes.io/name: mlshield
    app.kubernetes.io/component: api-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: mlshield
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mlshield
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: event-bus
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mlshield
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: event-bus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
